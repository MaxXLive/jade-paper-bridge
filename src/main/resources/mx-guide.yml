mxguide:
  enabled: true
  id: jadepaperbridge
  name: JadePaperBridge
  description: Extended block and entity info for Jade mod users
  priority: 60
  silent: false
  message:
    - "Install the Jade client mod to see detailed overlay info on blocks and entities."
    - "This server adds: chest/barrel inventories, furnace and brewing stand progress,"
    - "beehive status, villager trade cooldowns, mob health and more."
    - "To activate: open Jade's config screen (default key: H) → Plugin Settings"
    - "and enable the providers you want (e.g. Storage, Brewing Stand, Beehive)."
