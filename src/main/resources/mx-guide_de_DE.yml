mxguide:
  enabled: true
  id: jadepaperbridge
  name: JadePaperBridge
  description: Erweiterte Block-Infos für Jade-Mod-Nutzer
  priority: 60
  silent: false
  message:
    - "Mit dem Jade Client-Mod werden detaillierte Overlay-Infos auf Blöcken und Entities angezeigt."
    - "Dieser Server liefert: Truhen-/Barrel-Inventare, Ofen- und Braustand-Fortschritt,"
    - "Bienenstock-Status, Villager-Trade-Cooldowns, Mob-Health und mehr."
    - "Aktivieren: Jades Config-Screen öffnen (Standard: Taste H) → Plugin Settings"
    - "und die gewünschten Provider aktivieren (z.B. Storage, Brewing Stand, Beehive)."
